<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efek Salju Turun Transparan</title>
    <style>
        /* Reset margin dan padding dasar */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Mencegah scrollbar muncul saat salju jatuh ke bawah */
            
            /* Latar belakang gelap HANYA untuk melihat salju putih di preview ini. 
               Hapus atau ubah background ini jika ingin menempelkan canvas di web Anda sendiri. */
            background: linear-gradient(to bottom, #1a2a6c, #b21f1f, #fdbb2d);
        }

        /* Styling untuk Canvas */
        #snowCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            /* Latar belakang canvas sepenuhnya transparan */
            background-color: transparent; 
            /* Memastikan klik mouse tembus ke elemen di bawah canvas */
            pointer-events: none; 
            z-index: 9999;
        }

        /* Teks informasi di tengah layar (opsional) */
        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.8);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            pointer-events: auto;
        }
        .content h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .content p {
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>Efek Salju Canvas</h1>
        <p>Latar belakang canvas ini 100% transparan.<br>Abaikan warna background gradasi pada halaman ini.</p>
    </div>

    <!-- Elemen Canvas tempat salju dirender -->
    <canvas id="snowCanvas"></canvas>

    <script>
        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let snowflakes = [];
        
        // Jumlah butiran salju maksimal
        const maxSnowflakes = 250;

        // Fungsi untuk mengatur ukuran canvas agar sesuai dengan layar
        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        class Snowflake {
            constructor() {
                this.reset();
            }

            // Fungsi untuk mereset posisi salju (dipanggil saat salju keluar layar atau pertama kali dibuat)
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height - height; // Mulai dari atas (bahkan di luar layar)
                this.radius = Math.random() * 3 + 1; // Ukuran bervariasi antara 1 - 4px
                this.speedY = Math.random() * 1.5 + 0.5; // Kecepatan jatuh bervariasi
                this.speedX = Math.random() * 1 - 0.5; // Kecepatan gerak horizontal (angin)
                this.opacity = Math.random() * 0.5 + 0.3; // Transparansi butiran
                this.swing = Math.random() * Math.PI * 2; // Ayunan alami (sin wave)
                this.swingSpeed = Math.random() * 0.02 + 0.01;
            }

            // Fungsi untuk memperbarui posisi
            update() {
                this.y += this.speedY;
                this.swing += this.swingSpeed;
                
                // Menambahkan pergerakan mengayun secara horizontal (kiri-kanan)
                this.x += this.speedX + Math.sin(this.swing) * 0.5;

                // Jika salju melewati batas bawah layar, reset ke atas
                if (this.y > height + this.radius) {
                    this.reset();
                    this.y = -this.radius; // Taruh di atas layar
                }
                
                // Membungkus (wrap) layar jika salju keluar dari kiri atau kanan
                if (this.x > width + this.radius) {
                    this.x = -this.radius;
                } else if (this.x < -this.radius) {
                    this.x = width + this.radius;
                }
            }

            // Fungsi untuk menggambar butiran salju di canvas
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
                ctx.closePath();
            }
        }

        function init() {
            resizeCanvas();
            snowflakes = [];
            for (let i = 0; i < maxSnowflakes; i++) {
                snowflakes.push(new Snowflake());
            }
            animate();
        }

        function animate() {
            // Hapus canvas untuk menggambar frame baru (INILAH yang menjaga canvas tetap transparan)
            ctx.clearRect(0, 0, width, height);

            // Update dan gambar setiap butiran salju
            for (let i = 0; i < snowflakes.length; i++) {
                snowflakes[i].update();
                snowflakes[i].draw();
            }

            // Request frame berikutnya
            requestAnimationFrame(animate);
        }

        // Jalankan saat jendela dimuat
        window.onload = init;

        // Sesuaikan ukuran canvas saat jendela di-resize
        window.addEventListener('resize', () => {
            resizeCanvas();
        });
    </script>
</body>
</html>
